<style>
:root {
  --g1: #0b331a;
  --g2: #14532d;
  --g3: #166534;
  --g4: #22c55e;
  --g5: #f0fdf4;
  --gold: #c8a84b;
  --gold2: #f0d878;
  --red: #dc2626;
  --orange: #ea580c;
  --blue: #2563eb;
  --bg: #f8fafc;
  --card: #ffffff;
  --border: #e2e8f0;
  --text: #0f172a;
  --text2: #374151;
  --text3: #6b7280;
  --radius: 20px;
  --radius-sm: 12px;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
  --shadow: 0 4px 20px rgba(0,0,0,0.1);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family: "Plus Jakarta Sans", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 90px; overflow-x: hidden; }

/* ===== SPLASH ===== */
#splash {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(160deg, var(--g1) 0%, #061a0e 50%, var(--g2) 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  transition: opacity 0.6s ease, transform 0.6s ease;
}
#splash.hide { opacity: 0; transform: scale(1.05); pointer-events: none; }
.splash-logo { width: 88px; height: 88px; object-fit: contain; margin-bottom: 22px; filter: drop-shadow(0 0 24px rgba(200,168,75,0.4)); }
.splash-title { font-family: "Syne", sans-serif; font-size: 44px; font-weight: 800; color: #fff; letter-spacing: 6px; }
.splash-title span { color: var(--gold); }
.splash-sub { font-size: 11px; color: rgba(255,255,255,0.45); letter-spacing: 3px; text-transform: uppercase; margin-top: 6px; margin-bottom: 52px; }
.splash-bar { width: 180px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
.splash-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 10px; animation: splashLoad 1s ease forwards; }
@keyframes splashLoad { from { width: 0; } to { width: 100%; } }

/* ===== APP ===== */
#app { display: none; }
#app.ready { display: block; }

/* ===== TOPBAR ===== */
.topbar {
  background: var(--g1); padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 200;
  border-bottom: 2px solid var(--gold);
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-logo-img { width: 36px; height: 36px; object-fit: contain; }
.topbar-name { font-family: "Syne", sans-serif; font-size: 20px; font-weight: 800; color: #fff; letter-spacing: 1px; }
.topbar-name span { color: var(--gold); }
.topbar-commune { font-size: 11px; color: var(--gold2); font-weight: 600; text-transform: uppercase; }
.topbar-role-btn {
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
  padding: 8px 14px; border-radius: 30px; font-size: 12px; font-weight: 700; color: #fff;
  cursor: pointer; transition: background 0.2s;
}
.topbar-role-btn:hover { background: rgba(255,255,255,0.18); }

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: #fff; display: flex; border-top: 2px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 12px 4px 10px; cursor: pointer; transition: background 0.2s; position: relative;
}
.nav-item .nav-icon { font-size: 24px; margin-bottom: 2px; }
.nav-item .nav-label { font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; }
.nav-item.active .nav-label { color: var(--g1); }
.nav-item.active { background: var(--g5); }
.nav-badge {
  position: absolute; top: 6px; right: calc(50% - 22px);
  background: var(--red); color: #fff; border-radius: 10px;
  font-size: 10px; font-weight: 800; padding: 1px 6px;
}

/* ===== PAGES ===== */
.page { display: none; }
.page.active { display: block; }

/* ===== CITOYEN PAGE ===== */
.hero-cta-box {
  background: linear-gradient(135deg, var(--g1), var(--g2));
  padding: 28px 16px 24px; text-align: center; color: white;
}
.hero-cta-box h1 { font-family: "Syne", sans-serif; font-size: 24px; margin-bottom: 6px; }
.hero-cta-box p { font-size: 14px; color: var(--gold2); opacity: 0.9; margin-bottom: 22px; }

.action-trigger-btn {
  width: 100%; background: var(--gold); color: var(--g1); border: none; padding: 20px;
  border-radius: var(--radius); font-family: "Syne", sans-serif; font-size: 18px; font-weight: 800;
  box-shadow: 0 8px 24px rgba(200,168,75,0.4); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  transition: transform 0.15s, box-shadow 0.15s;
}
.action-trigger-btn:active { transform: scale(0.97); }

.flow-container { padding: 16px; }
.section-title {
  font-family: "Syne", sans-serif; font-size: 15px; font-weight: 800;
  color: var(--g1); margin: 18px 0 12px; padding-left: 2px;
}

/* Category Grid */
.category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
.category-card {
  background: white; border: 3px solid var(--border); padding: 20px 12px; border-radius: var(--radius);
  text-align: center; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow-sm);
}
.category-card:active { transform: scale(0.97); }
.category-card .cat-emoji { font-size: 38px; display: block; margin-bottom: 8px; }
.category-card .cat-title { font-size: 13px; font-weight: 700; color: var(--text); }
.category-card.selected { border-color: var(--g4); background: var(--g5); box-shadow: 0 0 0 2px var(--g3); }

/* Camera Box */
.camera-box {
  background: white; border: 3px dashed var(--text3); border-radius: var(--radius);
  padding: 30px 16px; text-align: center; cursor: pointer; margin-bottom: 16px; transition: all 0.2s;
}
.camera-box.has-file { border-style: solid; border-color: var(--g4); background: var(--g5); }
.camera-icon { font-size: 44px; display: block; margin-bottom: 6px; }
.camera-text { font-size: 14px; font-weight: 700; color: var(--text2); }
#imgPreview { width: 100%; border-radius: var(--radius-sm); margin-top: 12px; display: none; max-height: 250px; object-fit: cover; }

/* Inputs */
.input-minimal {
  width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: var(--radius-sm);
  font-size: 14px; font-family: inherit; margin-bottom: 12px; background: white; outline: none; color: var(--text);
}
.input-minimal:focus { border-color: var(--g3); }

.btn-big-submit {
  width: 100%; padding: 18px; background: var(--g2); color: white; border: none;
  border-radius: var(--radius); font-family: "Syne", sans-serif; font-size: 18px; font-weight: 800;
  cursor: pointer; box-shadow: 0 6px 20px rgba(20,83,45,0.3);
  display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s;
}
.btn-big-submit:disabled { background: var(--text3); cursor: not-allowed; box-shadow: none; }
.btn-big-submit:not(:disabled):active { transform: scale(0.98); }

/* Recent cards */
.recent-card {
  background: white; border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px;
  border: 1px solid var(--border); display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow-sm);
}
.recent-img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: #eee; flex-shrink: 0; }
.recent-info { flex: 1; min-width: 0; }
.recent-type { font-size: 13px; font-weight: 700; }
.recent-loc { font-size: 11px; color: var(--text3); margin-top: 3px; }
.status-badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; flex-shrink: 0; }
.status-nouveau { background: #fee2e2; color: var(--red); }
.status-encours { background: #ffedd5; color: var(--orange); }
.status-resolu { background: var(--g5); color: var(--g3); }

/* ===== MAP ===== */
#map { height: calc(100vh - 145px); width: 100%; }

/* ===== DASHBOARD ===== */
.dash-container { padding: 12px; }
.dash-summary {
  background: var(--g1); color: white; padding: 18px 16px; border-radius: var(--radius); margin-bottom: 14px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center;
}
.dash-count-box h3 { font-family: "Syne", sans-serif; font-size: 26px; color: var(--gold2); }
.dash-count-box p { font-size: 10px; opacity: 0.75; text-transform: uppercase; margin-top: 3px; letter-spacing: 0.5px; }

/* Filter chips */
.filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; -webkit-overflow-scrolling: touch; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-chip {
  padding: 7px 14px; border-radius: 20px; white-space: nowrap;
  font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0;
  border: 2px solid var(--border); background: white; color: var(--text2); transition: all 0.2s;
}
.filter-chip.active { background: var(--g2); color: white; border-color: var(--g2); }

/* Ticket cards */
.ticket-card {
  background: white; border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
  border: 1px solid var(--border); box-shadow: var(--shadow-sm);
}
.ticket-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.ticket-title { font-size: 14px; font-weight: 800; color: var(--text); }
.ticket-ref { font-size: 11px; color: var(--text3); margin-bottom: 6px; }
.ticket-meta { font-size: 12px; color: var(--text2); margin-bottom: 10px; }
.ticket-desc { font-size: 13px; color: var(--text2); background: var(--bg); padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; line-height: 1.5; }

/* Before/After */
.proof-container { display: flex; gap: 8px; margin-bottom: 12px; }
.proof-box { flex: 1; position: relative; background: var(--bg); border-radius: 8px; aspect-ratio: 4/3; overflow: hidden; border: 1px solid var(--border); }
.proof-box img { width: 100%; height: 100%; object-fit: cover; }
.proof-tag { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.65); color: white; font-size: 9px; padding: 2px 7px; border-radius: 4px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
.proof-empty { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 11px; color: var(--text3); text-align: center; padding: 6px; }

.ticket-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-action { flex: 1; min-width: 80px; padding: 10px 8px; border: none; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; text-align: center; text-transform: uppercase; letter-spacing: 0.3px; transition: all 0.2s; }
.btn-action:active { transform: scale(0.96); }
.btn-action.work { background: #ffedd5; color: var(--orange); }
.btn-action.done { background: var(--g5); color: var(--g2); }
.btn-action.photo-after { background: #eff6ff; color: var(--blue); }
.btn-action.wa { background: #dcfce7; color: #16a34a; }
.btn-action:disabled { opacity: 0.4; cursor: not-allowed; }

/* Google Maps button */
.btn-maps {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 100%; padding: 13px 16px; margin-bottom: 12px;
  background: white; border: 2px solid #4285f4; border-radius: var(--radius-sm);
  color: #4285f4; font-size: 14px; font-weight: 800; text-decoration: none;
  text-align: center; transition: all 0.2s;
}
.btn-maps:active { background: #eff6ff; transform: scale(0.98); }

/* ===== SUCCESS MODAL ===== */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.overlay.show { opacity: 1; pointer-events: all; }
.modal { background: white; border-radius: var(--radius); padding: 28px 24px; text-align: center; width: 100%; max-width: 320px; transform: scale(0.9) translateY(20px); transition: all 0.25s; }
.overlay.show .modal { transform: scale(1) translateY(0); }
.modal h2 { font-family: "Syne", sans-serif; font-size: 20px; margin-bottom: 8px; color: var(--text); }
.modal p { font-size: 13px; color: var(--text2); margin-bottom: 18px; line-height: 1.6; }
.modal-btn-wa { width:100%; padding:14px; background:#25d366; color:white; border:none; border-radius:10px; font-weight:800; cursor:pointer; margin-bottom:10px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:14px; text-decoration:none; }
.modal-btn-close { width:100%; padding:12px; border:2px solid var(--border); background:white; border-radius:10px; font-weight:700; cursor:pointer; font-size:14px; color: var(--text2); }

/* ===== PIN OVERLAY ===== */
.pin-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
  z-index: 2000; display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.pin-overlay.show { opacity: 1; pointer-events: all; }
.pin-sheet {
  background: white; width: 100%; border-radius: 24px 24px 0 0; padding: 28px 20px 36px;
  transform: translateY(100%); transition: transform 0.32s cubic-bezier(0.34, 1.3, 0.64, 1);
}
.pin-overlay.show .pin-sheet { transform: translateY(0); }
.pin-title { font-family: "Syne", sans-serif; font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
.pin-sub { font-size: 13px; color: var(--text3); margin-bottom: 20px; }

/* PIN dots */
.pin-dots { display: flex; gap: 14px; justify-content: center; margin-bottom: 20px; }
.pin-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--g2); background: transparent; transition: background 0.2s; }
.pin-dot.filled { background: var(--g2); }

.pin-error { color: var(--red); font-size: 13px; text-align: center; margin-bottom: 14px; display: none; }

/* PIN keypad */
.pin-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 260px; margin: 0 auto 16px; }
.pin-key {
  padding: 18px; font-size: 22px; font-weight: 700; border: 1.5px solid var(--border);
  border-radius: 14px; background: white; cursor: pointer; font-family: inherit;
  transition: all 0.15s; color: var(--text); text-align: center;
}
.pin-key:active { background: var(--g5); border-color: var(--g2); transform: scale(0.94); }
.pin-key.confirm { background: var(--g2); color: white; border-color: var(--g2); font-size: 18px; }
.pin-key.confirm:active { background: var(--g1); }
.pin-key.del { font-size: 18px; }
.pin-cancel { width: 100%; padding: 14px; border: 1.5px solid var(--border); border-radius: 12px; background: white; font-size: 14px; color: var(--text3); font-weight: 700; cursor: pointer; font-family: inherit; }

/* ===== LOCALISATION CARD ===== */
.loc-card {
  background: white; border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 18px 16px; margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.loc-card-title {
  font-size: 15px; font-weight: 800; color: var(--text);
  margin-bottom: 16px;
}
.loc-label {
  font-size: 11px; font-weight: 800; color: var(--text2);
  letter-spacing: 0.5px; margin-bottom: 6px;
}
.loc-card .input-minimal {
  margin-bottom: 14px; background: var(--bg); border-color: var(--border);
}
.loc-card .btn-gps {
  margin-bottom: 0;
}

/* ===== GPS BUTTON ===== */
.btn-gps {
  width: 100%; padding: 16px; border: 2px solid var(--g3);
  border-radius: var(--radius-sm); background: white; color: var(--g2);
  font-family: inherit; font-size: 15px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  gap: 10px; margin-bottom: 10px; transition: all 0.2s;
}
.btn-gps:active { background: var(--g5); transform: scale(0.98); }
.btn-gps.loading { background: #fffbeb; color: #92400e; border-color: #f59e0b; }
.btn-gps.success { background: var(--g5); color: var(--g2); border-color: var(--g4); }
.btn-gps.error { background: #fee2e2; color: var(--red); border-color: var(--red); }

/* ===== GPS INDICATOR ===== */
.gps-indicator {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 600; margin-bottom: 14px;
  border: 1.5px solid var(--border); background: white; transition: all 0.3s;
}
.gps-indicator.loading { border-color: #f59e0b; background: #fffbeb; color: #92400e; }
.gps-indicator.success { border-color: var(--g4); background: var(--g5); color: var(--g2); }
.gps-indicator.error { border-color: var(--red); background: #fee2e2; color: var(--red); }
.gps-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.gps-indicator.loading .gps-dot { background: #f59e0b; animation: gpsPulse 1s infinite; }
.gps-indicator.success .gps-dot { background: var(--g4); }
.gps-indicator.error .gps-dot { background: var(--red); }
@keyframes gpsPulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
/* ===== DASHBOARD STATS ===== */
.stat-card {
  background: white; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm);
}
.stat-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.stat-card-title { font-size: 13px; font-weight: 800; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-card-value { font-family: "Syne", sans-serif; font-size: 22px; font-weight: 800; color: var(--g2); }
.stat-card-sub { font-size: 11px; color: var(--text3); margin-top: 6px; }

.progress-track { width: 100%; height: 10px; background: var(--border); border-radius: 10px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--g3), var(--g4)); border-radius: 10px; transition: width 0.8s ease; }

/* Quartier bars */
.quartier-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.quartier-bar-label { font-size: 12px; font-weight: 700; color: var(--text2); width: 110px; flex-shrink: 0; }
.quartier-bar-track { flex: 1; height: 8px; background: var(--border); border-ra
